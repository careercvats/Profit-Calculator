function vS(){const e=edit?S.sales.find(s=>s.id===edit):null,v=(k,d='')=>E(e?e[k]:d),L=S.sales.filter(s=>!q||(s.order+s.name+s.emp+s.notes).toLowerCase().includes(q.toLowerCase())).sort((a,b)=>b.date.localeCompare(a.date));
 return `<section class="p"><h2>${e?'تعديل عملية بيع':'تسجيل بيع'}</h2><form onsubmit="saveSale();return false" class="f"><label>التاريخ<input type="date" id="f_t" required value="${e?e.date:iso(now)}"></label><label>الفرع<input id="f_b" value="${v('branch','مصر')}"></label><label>رقم الطلب/العميل<input id="f_o" value="${v('order')}"></label><label>الفئة<select id="f_k" onchange="fillP()"><option value="p">باقة</option><option value="s" ${e&&e.cat==='s'?'selected':''}>خدمة فردية</option></select></label><label>المنتج<select id="f_p" onchange="fillPrice()"></select></label><label>الكمية<input type="number" id="f_q" min="1" step="1" value="${v('qty',1)}"></label><label>سعر البيع الفعلي للوحدة<input type="number" id="f_price" step="any" value="${e?e.price:''}"></label><label>خصم إضافي (إجمالي)<input type="number" id="f_d" step="any" min="0" value="${v('discount',0)}"></label><label>مبلغ مسترد<input type="number" id="f_r" step="any" min="0" value="${v('refund',0)}"></label><label>حالة الدفع<select id="f_s">${Object.entries(ST).map(([k,t])=>`<option value="${k}" ${e&&e.status===k?'selected':''}>${t}</option>`).join('')}</select></label><label>المبلغ المحصّل<input type="number" id="f_c" step="any" min="0" value="${e?e.collected:''}"></label><label>موظف المبيعات<input id="f_e" list="emps" value="${v('emp')}"><datalist id="emps"><option>Aya<option>Mariam<option>Ashraqat</datalist></label><label>ملاحظات<input id="f_n" value="${v('notes')}"></label><label>&nbsp;<button class="b">${e?'حفظ التعديل':'إضافة البيع'}</button></label>${e?'<label>&nbsp;<button type="button" onclick="edit=null;render()">إلغاء</button></label>':''}</form><div id="pinfo" class="note"></div></section>
 <section class="p"><h2>السجل</h2><input placeholder="بحث ثم Enter..." value="${E(q)}" onchange="q=this.value;render()"><table><tr><th>التاريخ</th><th>الطلب</th><th>المنتج</th><th>كمية</th><th>سعر</th><th>خصم</th><th>مسترد</th><th>صافي</th><th>تكلفة</th><th>الحالة</th><th>محصّل</th><th>مستحق</th><th>الموظف</th><th></th></tr>${L.map(s=>{const c=saleCalc(s,S.set.refCost,S.prods);return `<tr><td>${s.date}</td><td>${E(s.order)}</td><td>${E(s.name)}</td><td>${s.qty}</td><td>${f$(s.price)}</td><td>${f$(s.discount)}</td><td>${f$(s.refund)}</td><td>${f$(c.net)}</td><td>${c.inc?'<span class="w">غير مُدخلة</span>':f$(c.cost)}</td><td>${ST[s.status]}</td><td>${f$(s.collected)}</td><td>${f$(c.recv)}</td><td>${E(s.emp)}</td><td><button onclick="edit='${s.id}';render()">تعديل</button> <button class="d" onclick="delS('${s.id}')">حذف</button></td></tr>`}).join('')||'<tr><td colspan="14">لا توجد مبيعات بعد. سجّل أول عملية من النموذج أعلاه.</td></tr>'}</table></section>`}
function fillP(){if(!$('#f_k'))return;const k=$('#f_k').value,cur=edit?S.sales.find(s=>s.id===edit)?.pid:null;$('#f_p').innerHTML=S.prods.filter(p=>p.cat===k).map(p=>`<option value="${p.id}" ${p.id===cur?'selected':''}>${E(p.name)}</option>`).join('');fillPrice()}
function fillPrice(){const p=S.prods.find(x=>x.id===$('#f_p').value);if(p)$('#pinfo').innerHTML=`السعر الافتراضي: ${p.price==null?'<b class="w">غير محدد – أدخل السعر الفعلي</b>':f$(p.price)} | تكلفة التنفيذ: ${p.cost==null?'<b class="w">غير مُدخلة</b>':f$(p.cost)}`}
function saveSale(){const g=i=>$('#'+i).value,p=S.prods.find(x=>x.id===g('f_p')),old=edit?S.sales.find(s=>s.id===edit):null;if(!p)return alert('اختر منتجاً');
 const qty=num(g('f_q'));if(!(qty>0))return alert('الكمية غير صحيحة');let price=num(g('f_price'));if(price==null)price=p.price;if(price==null)return alert('هذا المنتج بلا سعر محدد. أدخل سعر البيع الفعلي.');
 const dsc=num(g('f_d'))||0,base=price*qty-dsc,st=g('f_s');let rf=num(g('f_r'))||0,co=num(g('f_c'));if(base<0)return alert('الخصم أكبر من قيمة البيع');
 if(st==='Paid'&&co==null)co=base;if(st==='Unpaid')co=0;if(st==='Refunded'){if(!rf)rf=base;if(co==null)co=base}if(co==null)co=0;if(st==='Partial'&&!(co>0&&co<base-rf))return alert('في الدفع الجزئي: أدخل مبلغاً محصّلاً أكبر من صفر وأقل من صافي المطلوب.');
 const keep=old&&old.pid===p.id,rec={id:edit||'s'+Date.now()+Math.random().toString(36).slice(2,6),date:g('f_t'),branch:g('f_b'),order:g('f_o'),cat:p.cat,pid:p.id,name:p.name,qty,defPrice:keep?old.defPrice:(p.price??price),price,discount:dsc,refund:rf,status:st,collected:co,emp:g('f_e'),notes:g('f_n'),cost:keep?old.cost:p.cost};
 if(edit)S.sales[S.sales.findIndex(s=>s.id===edit)]=rec;else S.sales.push(rec);edit=null;save();render()}
function delS(id){if(confirm('حذف هذه العملية نهائياً؟')){S.sales=S.sales.filter(s=>s.id!==id);save();render()}}
function vX(){return `<section class="p"><h2>تسجيل مصروف</h2><form onsubmit="addX();return false" class="f"><label>التاريخ<input type="date" id="x_t" required value="${iso(now)}"></label><label>الفئة<select id="x_c">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></label><label>الوصف<input id="x_d"></label><label>المبلغ<input type="number" id="x_a" step="any" min="0" required></label><label>النوع<select id="x_r"><option value="0">لمرة واحدة</option><option value="1">متكرر</option></select></label><label>الدفع<select id="x_p"><option value="1">مدفوع</option><option value="0">غير مدفوع</option></select></label><label>ملاحظات<input id="x_n"></label><label>&nbsp;<button class="b">إضافة</button></label></form><div class="note">الرواتب والإعلانات: عند تسجيل مصروف فعلي منها في شهر، يُستخدم بدل الميزانية الشهرية لنفس الشهر (دون احتسابهما معاً). الثابت: الرواتب، الإيجار، الاشتراكات؛ المتغير: الاسترداد، رسوم الدفع.</div></section><section class="p"><table><tr><th>التاريخ</th><th>الفئة</th><th>الوصف</th><th>المبلغ</th><th>النوع</th><th>الدفع</th><th>ملاحظات</th><th></th></tr>${[...S.exp].sort((a,b)=>b.date.localeCompare(a.date)).map(e=>`<tr><td>${e.date}</td><td>${e.cat}</td><td>${E(e.desc)}</td><td>${f$(e.amount)}</td><td>${e.rec?'متكرر':'مرة واحدة'}</td><td>${e.paid?'مدفوع':'غير مدفوع'}</td><td>${E(e.notes)}</td><td><button class="d" onclick="delX('${e.id}')">حذف</button></td></tr>`).join('')||'<tr><td colspan="8">لا توجد مصروفات مسجلة.</td></tr>'}</table></section>`}
function addX(){const g=i=>$('#'+i).value,e={id:'x'+Date.now(),date:g('x_t'),cat:g('x_c'),desc:g('x_d'),amount:num(g('x_a')),rec:g('x_r')==='1',paid:g('x_p')==='1',notes:g('x_n')};if(e.amount==null||e.amount<0)return alert('المبلغ غير صحيح');
 if(S.exp.some(x=>x.date===e.date&&x.cat===e.cat&&x.amount===e.amount&&x.desc===e.desc)&&!confirm('⚠ يوجد مصروف مطابق (نفس التاريخ والفئة والمبلغ والوصف). هل تريد الإضافة رغم ذلك؟'))return;S.exp.push(e);save();render()}
function delX(id){if(confirm('حذف هذا المصروف؟')){S.exp=S.exp.filter(e=>e.id!==id);save();render()}}
function vP(){const st=S.set,fld=(k,l)=>`<label>${l}<input type="number" step="any" min="0" value="${st[k]}" onchange="S.set.${k}=num(this.value)||0;save()"></label>`;
 return `<section class="p"><h2>الإعدادات الشهرية</h2><div class="f">${fld('salary','إجمالي رواتب الموظفين الشهري')}${fld('ad','ميزانية الإعلانات الشهرية (4 أسابيع × 7,000)')}${fld('rent','إيجار')}${fld('soft','اشتراكات وبرامج')}${fld('bank','رسوم بنكية/دفع')}${fld('tax','ضرائب شهرية (لم تُحدد)')}<label>سياسة الاسترداد<select onchange="S.set.refCost=this.value==='1';save()"><option value="0">تكلفة التنفيذ لا تُسترد</option><option value="1" ${st.refCost?'selected':''}>تُسترد بنسبة المبلغ المسترد</option></select></label></div><div class="note">الصفر في الإيجار والاشتراكات والرسوم والضرائب = غير مُدخل، وليس بالضرورة عدم وجود مصروف.</div></section>
 <section class="p"><h2>أسعار وتكاليف المنتجات</h2><div class="note">اترك الخانة فارغة = غير محدد. تغيير السعر أو التكلفة هنا لا يغيّر العمليات المسجلة سابقاً، باستثناء العمليات التي سُجلت بلا تكلفة: تُحسب بالتكلفة التي تُدخلها لاحقاً.</div><table><tr><th>المنتج</th><th>النوع</th><th>سعر البيع</th><th>تكلفة التنفيذ</th></tr>${S.prods.map(p=>`<tr><td>${E(p.name)}</td><td>${p.cat==='p'?'باقة':'خدمة'}</td><td><input type="number" step="any" min="0" value="${p.price??''}" onchange="setPC('${p.id}','price',this.value)"></td><td><input type="number" step="any" min="0" value="${p.cost??''}" onchange="setPC('${p.id}','cost',this.value)"></td></tr>`).join('')}</table></section>`}
function setPC(id,k,v){S.prods.find(p=>p.id===id)[k]=num(v);save()}
function vC(){const ops=['sal','ad','oth'],on={sal:'رواتب',ad:'إعلانات',oth:'مصروفات أخرى'};
 return `<div class="note">السيناريوهات تقديرات وليست نتائج مضمونة، ولا تغيّر البيانات الفعلية. الأسعار والتكاليف من صفحة الأسعار. المنتجات بلا سعر تُتجاهل وبلا تكلفة تُعلَّم غير مكتملة.</div><section class="p"><table><tr><th>المنتج / الافتراض</th>${S.scen.map((s,i)=>`<th>${E(s.n)}<br><button onclick="fillSc(${i})">تعبئة من الفترة × معامل</button></th>`).join('')}</tr>${S.prods.map(p=>`<tr><td>${E(p.name)}</td>${S.scen.map((s,i)=>`<td><input type="number" min="0" value="${s.q[p.id]||''}" oninput="S.scen[${i}].q['${p.id}']=num(this.value)||0;save();calcScen()"></td>`).join('')}</tr>`).join('')}<tr><td>خصم %</td>${S.scen.map((s,i)=>`<td><input type="number" min="0" max="100" value="${s.disc}" oninput="S.scen[${i}].disc=num(this.value)||0;save();calcScen()"></td>`).join('')}</tr>${ops.map(o=>`<tr><td>${on[o]} (فارغ = من الإعدادات)</td>${S.scen.map((s,i)=>`<td><input type="number" min="0" value="${s[o]??''}" oninput="S.scen[${i}].${o}=num(this.value);save();calcScen()"></td>`).join('')}</tr>`).join('')}<tbody id="sres"></tbody></table></section>`}
function calcScen(){const R=S.scen.map(s=>scenCalc(S,s)),row=(l,f)=>`<tr><th>${l}</th>${R.map(r=>`<td>${f(r)}</td>`).join('')}</tr>`;
 $('#sres').innerHTML=row('الإيراد المتوقع',r=>f$(r.rev))+row('التكاليف المباشرة',r=>f$(r.cost)+(r.inc?' ⚠ غير مكتملة':''))+row('المساهمة',r=>f$(r.contrib))+row('المصروفات التشغيلية',r=>f$(r.opex))+row('الربح/الخسارة',r=>`<b class="${r.profit>=0?'pos':'neg'}">${r.profit>=0?'▲':'▼'} ${f$(r.profit)}</b>`)+row('الهامش',r=>r.margin==null?'N/A':r.margin.toFixed(1)+'%')+row('التعادل',r=>r.profit>=0?'تم تجاوز التعادل':'تحت التعادل')}
function fillSc(i){const k=num(prompt('معامل الضرب على مبيعات الفترة المعروضة (مثال 0.5 أو 1 أو 1.5):','1'));if(k==null)return;const r=summarize(S,A,B);S.scen[i].q={};S.prods.forEach(p=>{const o=r.by[p.id];if(o)S.scen[i].q[p.id]=Math.round(o.q*k)});save();render()}
function vB(){return `<section class="p"><h2>نسخ احتياطي وتصدير</h2><div class="note">البيانات تُحفظ تلقائياً في متصفح Chrome هذا فقط (localStorage) وقد تضيع عند مسح بيانات المتصفح. صدّر نسخة JSON بانتظام. هذا النظام ليس قاعدة بيانات آمنة متعددة المستخدمين وليس بديلاً عن نظام محاسبي أو ضريبي رسمي.</div><div class="f"><button class="b" onclick="dl('backup.json',JSON.stringify(S),'application/json')">نسخة JSON</button><label>استعادة نسخة<input type="file" accept=".json" onchange="imp(this)"></label><button onclick="exS()">تصدير المبيعات CSV</button><button onclick="exX()">تصدير المصروفات CSV</button><button onclick="exM()">تصدير الملخص الشهري CSV</button><button class="b" onclick="exA()">تصدير Excel (3 أوراق)</button><button onclick="linkX()">ربط ملف Excel (حفظ تلقائي)</button></div><div class="note">ربط الملف: اختر مكان ملف على جهازك مرة واحدة وسيُحدَّث تلقائياً بعد كل تعديل (Chrome أو Edge على الكمبيوتر فقط). الربط ينتهي بإغلاق الصفحة فاضغط الزر مجدداً عند فتحها. حالة الربط: <b id="xst">${lst}</b></div><div class="f"><button class="d" onclick="if(confirm('حذف كل البيانات المسجلة؟ (تبقى الأسعار)')){S.sales=[];S.exp=[];save();render()}">حذف كل المبيعات والمصروفات</button></div></section>`}
function dl(n,t,m='text/csv;charset=utf-8'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()}
function imp(i){const f=i.files[0];if(!f)return;f.text().then(t=>{try{const o=JSON.parse(t);if(!validImport(o))throw 0;if(confirm('سيتم استبدال كل البيانات الحالية بالنسخة المختارة. متابعة؟')){S=norm(o);save();render()}}catch(e){alert('ملف غير صالح. لم يتم تغيير أي بيانات.')}})}
function exS(){dl('sales.csv',csv([['date','branch','order','category','product','qty','default_price','price','discount','refund','status','collected','unit_cost','employee','notes'],...S.sales.map(s=>[s.date,s.branch,s.order,s.cat,s.name,s.qty,s.defPrice,s.price,s.discount,s.refund,s.status,s.collected,s.cost,s.emp,s.notes])]))}
function exX(){dl('expenses.csv',csv([['date','category','description','amount','recurring','paid','notes'],...S.exp.map(e=>[e.date,e.cat,e.desc,e.amount,e.rec,e.paid,e.notes])]))}
function exM(){dl('monthly_summary.csv',csv([['month','net_revenue','direct_costs','contribution','salaries','advertising','other','profit','cash_collected','receivables'],...monthRows(S)]))}
function exA(){dl('CareerCV_Egypt_Finance.xls',xlsXml(S),'application/vnd.ms-excel')}
async function linkX(){try{fh=await showSaveFilePicker({suggestedName:'CareerCV_Egypt_Finance.xls',types:[{description:'Excel',accept:{'application/vnd.ms-excel':['.xls']}}]});await wx()}catch(e){fh=null;if(e.name!=='AbortError')alert('تعذر ربط الملف: '+e.message)}}
async function wx(){if(!fh)return;try{const w=await fh.createWritable();await w.write(new Blob([xlsXml(S)],{type:'application/vnd.ms-excel'}));await w.close();lst='تم الحفظ في الملف '+new Date().toLocaleTimeString('ar-EG')}catch(e){lst='فشل الحفظ في الملف: '+e.message;fh=null}const el=$('#xst');if(el)el.textContent=lst}
render();
</script></body></html>
